CONSTANTS
    \* 定义三个键：k1, k2, k3
    KEY = {k1, k2}
    \* 定义两个客户端：c1, c2
    CLIENT = {c1}
    \* 定义每个客户端的主键
    CLIENT_PRIMARY_KEY = [k1]

\* 指定初始状态和下一状态关系
INIT Init
NEXT Next

\* 指定要检查的不变量
INVARIANTS
    TypeInvariant
    WriteConsistency
    LockConsistency
    CommittedConsistency
    AbortedConsistency
    SnapshotIsolation

\* 配置模型检查器
SPECIFICATION PercolatorSpec